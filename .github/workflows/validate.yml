name: Validate skill

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate SKILL.md and links
        run: python scripts/validate-skill.py

      - name: Check the skill packages cleanly
        run: |
          bash scripts/package-skill.sh
          unzip -l dist/denvora-ai-skills.skill
