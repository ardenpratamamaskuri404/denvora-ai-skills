name: "AI Hallucination or Inaccuracy Report"
description: Report a case where the AI invented APIs, skipped verification, or made unverified claims while using the skill.
title: "[Hallucination] "
labels: ["hallucination-report", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting this case! Real-world failure cases are the primary way **denvora-ai-skills** improves.
        *(Terima kasih atas laporannya! Kasus nyata seperti ini membantu kami menyempurnakan aturan di dalam skill. Anda dapat menulis dalam Bahasa Indonesia atau Bahasa Inggris.)*

        **Important:** Please remove any API keys, passwords, tokens, or sensitive code before submitting.
  - type: input
    id: agent
    attributes:
      label: AI Assistant and Model
      description: Which AI tool and model were you using?
      placeholder: "e.g., Claude Code (Claude Sonnet 4), Cursor, OpenCode, Antigravity (Gemini)"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Skill Version
      description: Release tag or commit hash, if known.
      placeholder: "v0.2.0"
  - type: dropdown
    id: category
    attributes:
      label: What went wrong?
      multiple: true
      options:
        - Invented a non-existent function, library, CLI flag, or version
        - Modified code without reading the existing file/project first
        - Modified unrelated files or left temporary debug clutter behind
        - Generated a large block of untested code all at once
        - Claimed "done / fixed / working" without verifying
        - Made repeated random guesses instead of following the debugging protocol
        - Asked too many unnecessary questions on a simple task
        - Replied in the wrong language or used overly complex jargon
        - The skill did not trigger automatically
        - Other
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: Your Prompt
      description: Paste the exact prompt you gave the AI.
      render: text
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual AI Behavior
      description: Paste the relevant part of the AI's response or describe what it did. Screenshots are welcome.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should a careful, honest AI assistant have done instead?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Project Context (Optional)
      description: Language, framework, versions, and operating system.
      placeholder: "Next.js 15, Node 22, Windows 11"
